<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Számvitel megoldástár</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Főkönyvi lap: bal oldalt példa-index, jobbra lépésenkénti könyvelés T-számlákon, alatta a három kimutatás. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#16222A; --muted:#5A6B73; --rule:#D3DCDB;
  --accent:#23664A; --accent-soft:#DDEDE4;
  --deb:#1D5A8C; --deb-soft:#E2ECF5; --cre:#9C3434; --cre-soft:#F6E4E2;
  --c-eszk:#1D5A8C; --c-forr:#7A4E12; --c-tok:#5B3F86; --c-kolt:#9C3434; --c-bev:#23664A;
  --warn-bg:#FBF3DF; --warn-ink:#6B4A07;
  --f-disp:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10181C; --surface:#18232A; --sunk:#141E23; --ink:#E3EAEC; --muted:#93A4AC; --rule:#2B3A42;
  --accent:#6BC49A; --accent-soft:#1D3A2E;
  --deb:#77B0E0; --deb-soft:#1B2F40; --cre:#E68E89; --cre-soft:#3A2224;
  --c-eszk:#77B0E0; --c-forr:#E0B36F; --c-tok:#B9A0E6; --c-kolt:#E68E89; --c-bev:#6BC49A;
  --warn-bg:#33290F; --warn-ink:#EBCB82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181C; --surface:#18232A; --sunk:#141E23; --ink:#E3EAEC; --muted:#93A4AC; --rule:#2B3A42;
  --accent:#6BC49A; --accent-soft:#1D3A2E;
  --deb:#77B0E0; --deb-soft:#1B2F40; --cre:#E68E89; --cre-soft:#3A2224;
  --c-eszk:#77B0E0; --c-forr:#E0B36F; --c-tok:#B9A0E6; --c-kolt:#E68E89; --c-bev:#6BC49A;
  --warn-bg:#33290F; --warn-ink:#EBCB82; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{max-width:1320px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(26px,3.4vw,36px);line-height:1.05;margin:0;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--f-mono);font-weight:600}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block}

.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:272px minmax(0,1fr);gap:28px;align-items:start}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
nav .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px 8px;font-weight:600}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
nav button{width:100%;display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:baseline;text-align:left;background:none;border:0;border-radius:4px;padding:6px 8px;cursor:pointer;color:var(--ink);font-size:13.5px;line-height:1.3}
nav button .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav button:hover{background:var(--surface)}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav button[aria-current="true"] .n{color:var(--bg);opacity:.75}

main{min-width:0;display:flex;flex-direction:column;gap:22px}
.head .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.head .eyebrow em{font-style:normal;color:var(--accent);font-weight:600}
.head h2{font-family:var(--f-disp);font-weight:700;font-size:clamp(24px,3vw,32px);line-height:1.1;margin:4px 0 12px;text-wrap:balance}
.task{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin:0;max-width:78ch;font-size:15px}
.task::before{content:"Feladat";display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}

.sec-t{font-family:var(--f-disp);font-weight:600;font-size:19px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-t small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}

/* lejátszó */
.player{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px}
.ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px}
.btn{border:1px solid var(--rule);background:var(--sunk);border-radius:4px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.dots button{width:30px;height:30px;border-radius:4px;border:1px solid var(--rule);background:var(--sunk);font-family:var(--f-mono);font-size:12px;cursor:pointer;color:var(--muted)}
.dots button.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dots button.cur{background:var(--accent);color:var(--surface);border-color:var(--accent)}

.stepbox{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-bottom:16px}
.expl{border-left:3px solid var(--accent);padding:4px 0 4px 14px;min-height:70px}
.expl .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.expl p{margin:4px 0 0;font-size:15.5px;max-width:62ch}
.journal{background:var(--sunk);border:1px dashed var(--rule);border-radius:4px;padding:10px 12px;font-size:13.5px;align-self:start}
.journal .jt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.jl{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:3px 0}
.jl .s{font-family:var(--f-mono);font-weight:600;font-size:12px;text-align:center;border-radius:3px;padding:0 2px}
.jl.T .s{background:var(--deb-soft);color:var(--deb)} .jl.K .s{background:var(--cre-soft);color:var(--cre)}
.jl.K .a{padding-left:14px}
.jl .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.journal .none{color:var(--muted);font-style:italic}

.taccs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tacc{border:1px solid var(--rule);border-radius:4px;background:var(--surface);overflow:hidden;animation:pop .45s ease both}
.tacc.hot{border-color:var(--accent)}
.th{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px 6px;border-bottom:2px solid var(--ink)}
.th .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.cat{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.tb{display:grid;grid-template-columns:1fr 1fr;min-height:56px}
.tb .col{padding:4px 8px 6px;display:flex;flex-direction:column;gap:2px}
.tb .col.d{border-right:2px solid var(--ink)}
.tb .ch{font-size:10px;color:var(--muted);letter-spacing:.08em;font-weight:600}
.tb .col.c .ch{text-align:right}
.r{display:flex;justify-content:space-between;gap:4px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;border-radius:3px;padding:1px 3px}
.r i{font-style:normal;font-size:10px;color:var(--muted);align-self:center}
.col.d .r span{color:var(--deb)} .col.c .r span{color:var(--cre)}
.r.new{animation:ink 1.4s ease both}
.col.d .r.new{--hl:var(--deb-soft)} .col.c .r.new{--hl:var(--cre-soft)}
.tf{border-top:1px solid var(--rule);padding:5px 10px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;background:var(--sunk)}
.tf b{font-family:var(--f-mono);color:var(--ink);font-weight:600}
.empty{color:var(--muted);font-style:italic;font-size:14px;padding:10px 0}
@keyframes pop{from{opacity:.0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes ink{0%{background:var(--hl);transform:translateX(-10px);opacity:0}25%{transform:none;opacity:1}100%{background:transparent}}

/* kimutatások */
.stmts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;min-width:0}
.card.wide{grid-column:1/-1}
.card h3{font-family:var(--f-disp);font-size:17px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.badge{font-family:var(--f-body);font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.bs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}
.bs .side h4{margin:0 0 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13.5px;border-bottom:1px dotted var(--rule);animation:fadeup .4s ease both}
.row .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.l0{font-weight:600}
.row.l1{padding-left:14px}
.row.l2{padding-left:28px;color:var(--muted)} .row.l2 .v{color:var(--ink)}
.row.it{padding-left:14px;color:var(--muted)} .row.it .v{color:var(--ink)}
.row.sub{font-weight:600}
.row.tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:6px;font-weight:700}
.row.zero .v{opacity:.45}
.row .v.neg{color:var(--cre)}
@keyframes fadeup{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.take{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.take .card p{margin:0;max-width:70ch}
.lbl2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent);margin-bottom:4px}
.note{background:var(--warn-bg);border-color:transparent}
.note .lbl2{color:var(--warn-ink)}
.note p{color:var(--warn-ink)}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager .btn{max-width:48%;text-align:left}
.kbd{font-size:12px;color:var(--muted)}
.kbd kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--surface)}

@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  nav{position:static;max-height:none;overflow-x:auto;overflow-y:hidden;padding:0 0 6px}
  nav .lbl{display:none}
  nav ol{flex-direction:row;gap:4px}
  nav button{grid-template-columns:1fr;width:auto;min-width:38px;padding:7px 6px;text-align:center;border:1px solid var(--rule);background:var(--surface)}
  nav button .t{display:none}
  nav button .n{font-size:13px;color:var(--ink)}
  .stepbox,.stmts,.take,.bs{grid-template-columns:minmax(0,1fr)}
  .bs{gap:14px}
  .dots{margin-left:0;width:100%}
  .kbd{display:none}
}

/* szakaszok */
.phases{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--rule);padding-bottom:10px}
.phases button{border:0;background:none;padding:6px 10px 6px 6px;border-radius:4px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.phases button span{font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;border:1px solid var(--rule)}
.phases button:hover{color:var(--ink)}
.phases button.done{color:var(--ink)} .phases button.done span{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.phases button.on{color:var(--ink);background:var(--sunk);font-weight:600} .phases button.on span{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.r.z{border-top:1px dashed var(--muted);margin-top:2px}
.r.z i{color:var(--accent);font-weight:700}
.tacc.closed{opacity:.55}
.tacc.closed .tf{color:var(--accent)}
details.mini{margin-top:16px}
details.mini summary{cursor:pointer;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:10px}
.sumT{border:1px solid var(--ink);border-radius:4px;background:var(--surface);max-width:760px}
.sumh{font-family:var(--f-disp);font-weight:700;font-size:17px;text-align:center;padding:8px 10px;border-bottom:2px solid var(--ink)}
.sumb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.sumb .col{padding:6px 12px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sumb .col.d{border-right:2px solid var(--ink)}
.sumb .ch{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.sumb .col.d .ch{color:var(--deb)} .sumb .col.c .ch{color:var(--cre);text-align:right}
.sr{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:3px 4px;border-bottom:1px dotted var(--rule);font-size:13.5px;border-radius:3px}
.sr small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.sr b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.sr.res{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
.sr.res b{font-weight:700;color:var(--accent)}
.sr.new{animation:ink 1.4s ease both;--hl:var(--accent-soft)}
.sr.ph{color:var(--muted)}
.sumf{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink);font-size:13px}
.sumf span{padding:6px 12px} .sumf span+span{text-align:right;border-left:2px solid var(--ink)}
.sumf b{font-family:var(--f-mono)}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.split .stmt{border-color:var(--rule)}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:12px}
.panel .ln{font-family:var(--f-disp);font-weight:600;font-size:18px;line-height:1.2;margin-top:6px}
.panel .lv{font-size:24px;font-weight:600;margin:2px 0 4px}
.panel .lv.neg{color:var(--cre)}
.srow{transition:opacity .25s,background .25s}
.srow.fut{opacity:.3;animation:none}
.srow.past{animation:none}
.srow.cur{background:var(--accent-soft);border-radius:3px;outline:1px solid var(--accent);animation:none}
.pl{display:grid;grid-template-columns:22px 18px minmax(0,1fr) auto;gap:6px;align-items:baseline;padding:2px 0;font-size:13px}
.pl .st{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pl .s{font-family:var(--f-mono);font-weight:600;font-size:11px;text-align:center;border-radius:3px}
.pl.T .s{background:var(--deb-soft);color:var(--deb)} .pl.K .s{background:var(--cre-soft);color:var(--cre)}
.pl small{color:var(--muted)}
.pl .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pnet{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);margin-top:4px;padding-top:4px;font-size:13px}
.pnet b{font-family:var(--f-mono)}
.rule{font-size:12px;color:var(--muted);margin-top:6px}
.journal small{color:var(--muted);font-size:11px}
@media (max-width:900px){.split,.sumb{grid-template-columns:minmax(0,1fr)}.sumb .col.d{border-right:0;border-bottom:2px solid var(--ink)}.sumb .col.c .ch{text-align:left}.panel{position:static}.split .panel{order:-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Számvitel megoldástár</h1>
    <p>Ormos Mihály példatára alapján · 27 gazdasági esemény lépésről lépésre · minden adat eFt-ban</p>
  </div>
  <div class="legend" aria-label="Jelmagyarázat">
    <span><b style="color:var(--deb)">T</b> Tartozik (bal)</span>
    <span><b style="color:var(--cre)">K</b> Követel (jobb)</span>
    <span><i class="dot" style="background:var(--c-eszk)"></i>Eszköz</span>
    <span><i class="dot" style="background:var(--c-forr)"></i>Kötelezettség</span>
    <span><i class="dot" style="background:var(--c-tok)"></i>Saját tőke</span>
    <span><i class="dot" style="background:var(--c-kolt)"></i>Költség, ráfordítás</span>
    <span><i class="dot" style="background:var(--c-bev)"></i>Bevétel</span>
  </div>
</header>

<div class="wrap">
  <nav aria-label="Példák"><div class="lbl">Példák</div><ol id="nav"></ol></nav>
  <main id="main"></main>
</div>

<script>
const e=(d,c,v)=>[{a:d,s:'T',v},{a:c,s:'K',v}];
const T=(a,v)=>({a,s:'T',v}), K=(a,v)=>({a,s:'K',v});
const SE='SEEAÉ (saját előállítású eszközök aktivált értéke)';

const CAT={eszk:['Áruk','Vevők','Pénztár','Műszaki berendezések','Elszámolási betétszámla','Anyagok','Ingatlanok','Egyéb berendezések','Üzleti vagy cégérték','Kísérleti fejlesztés aktivált értéke','Készletek','Beruházások, felújítások','Értékhelyesbítés','Aktív időbeli elhatárolások','Alapítás-átszervezés aktivált értéke','Vagyoni értékű jogok'],
forr:['Szállítók','Rövid lejáratú hitelek','Hosszú lejáratú kötelezettségek','Jövedelem-elszámolási számla','Tartozások kötvénykibocsátásból','Hosszú lejáratú kölcsönök','Rövid lejáratú kölcsönök','Vevőktől kapott előlegek','Céltartalékok','Passzív időbeli elhatárolások'],
tok:['Lekötött tartalék','Eredménytartalék','Értékelési tartalék','Jegyzett tőke','Tőketartalék'],
kolt:['ELÁBÉ','Fizetett kamatok','Anyagköltség','Bérköltség','Egyéb ráfordítások','Személyi jellegű ráfordítások','Értékcsökkenési leírás','Igénybe vett szolgáltatások'],
bev:['Árbevétel','Egyéb bevételek',SE]};

{t:'Gépsor eladása értékhelyesbítéssel',tag:'Eszközkivezetés',
task:'Értékesítjük egyik elavult gépsorunkat 22.000 eFt-ért. A gépsor bekerülési értéke évekkel ezelőtt 40.000 eFt volt, amelyből terv szerinti értékcsökkenési leírásként 16.000 eFt-ot számoltunk el. A tárgyévet megelőző évi értékelésünk szerint a gép könyv szerinti értéke a piaci érték alatt volt 3.000 eFt-tal, és vállalkozásunk élt a felértékelés lehetőségével.',

{x:'<b>Eladás:</b> a tárgyi eszköz értékesítése nem árbevétel, hanem <b>egyéb bevétel</b> (22.000). A vevő még nem fizetett.',p:e('Vevők','Egyéb bevételek',22000)},
{x:'<b>Könyv szerinti érték kivezetése:</b> 40.000 − 16.000 = 24.000 egyéb ráfordítás.',p:e('Egyéb ráfordítások','Műszaki berendezések',24000)},

key:'Eszköz eladásakor a bevétel az eladási ár, a ráfordítás a könyv szerinti érték (veszteség: 2.000). Az értékhelyesbítés a saját tőkén belül szűnik meg.',
note:'A megoldókulcs a befektetési CF-ben +22.000 eladást, a működésiben −22.000 vevőváltozást mutat. A nettó pénzhatás 0, mert a vevő még nem fizetett.'},

{t:'Céltartalék felhasználása és felszabadítása',tag:'Céltartalék',

cf:'I:0,1:2000,4:-6000,7:1500,10:2500,II:0,III:0,IV:0',
key:'A garancia lejártakor a céltartalékot teljesen fel kell oldani. A fel nem használt 2.000 adja a pozitív eredményt.'},

steps:[
{x:'<b>Céltartalék-képzés:</b> várható, becsülhető jövőbeni kötelezettség a tárgyévi értékesítéshez kapcsolódva. Egyéb ráfordítással szemben képezzük.',p:e('Egyéb ráfordítások','Céltartalékok',4000)}],

function parseKV(s,L){return s.split(',').map(x=>{const i=x.lastIndexOf(':');const k=x.slice(0,i);return {k,label:L[k]||k,v:+x.slice(i+1)}})}
function parseBS(s){if(!s)return[];return s.split('|').map(x=>{const i=x.lastIndexOf(':');return{l:+x[0],label:x.slice(1,i),v:+x.slice(i+1)}})}
function kids(arr,i){const out=[];for(let j=i+1;j<arr.length&&arr[j].l>arr[i].l;j++)out.push(arr[j]);if(!out.length)return[];const m=Math.min(...out.map(r=>r.l));return out.filter(r=>r.l===m)}
const sumStr=(parts,total)=>parts.map((p,i)=>(i===0?(p.v<0?'−':''):(p.v<0?' − ':' + '))+fmt(Math.abs(p.v))+(p.n?' <small>'+p.n+'</small>':'')).join('')+' = <b>'+fmt(total)+'</b>';

function build(x,n){
  const posts=[],bal={},order=[];
  x.steps.forEach((s,i)=>s.p.forEach(p=>{if(!(p.a in bal)){bal[p.a]=0;order.push(p.a)}bal[p.a]+=p.s==='T'?p.v:-p.v;posts.push({...p,st:i+1,cp:s.p.filter(q=>q.s!==p.s).map(q=>q.a)})}));
  const PL=order.filter(a=>['kolt','bev'].includes(catOf(a))).map(a=>{const c=catOf(a)==='kolt';return{a,side:c?'T':'K',v:c?bal[a]:-bal[a],g:PLG[a]}}).sort((p,q)=>PLO.indexOf(p.g)-PLO.indexOf(q.g));
  const costs=PL.filter(p=>p.side==='T').reduce((s,p)=>s+p.v,0),revs=PL.filter(p=>p.side==='K').reduce((s,p)=>s+p.v,0),res=revs-costs;
  const BSL=[...order.filter(a=>catOf(a)==='eszk'),...order.filter(a=>['forr','tok'].includes(catOf(a)))].map(a=>{const A=catOf(a)==='eszk';return{a,side:A?'T':'K',v:A?bal[a]:-bal[a]}});
  const isRows=parseKV(x.is,IL),isMap=Object.fromEntries(isRows.map(r=>[r.k,r.v]));
  const A=parseBS(x.bsA),P=parseBS(x.bsP);
  const sA=A.filter(r=>r.l===0).reduce((s,r)=>s+r.v,0),sP=P.filter(r=>r.l===0).reduce((s,r)=>s+r.v,0);
  const bsRows=[...A.map((r,i)=>({...r,side:'A',kids:kids(A,i)})),{tot:true,side:'A',label:'Eszközök összesen',v:sA,l:0},...P.map((r,i)=>({...r,side:'P',kids:kids(P,i)})),{tot:true,side:'P',label:'Források összesen',v:sP,l:0}];
  const cfRows=parseKV(x.cf,CL),cfMap=Object.fromEntries(cfRows.map(r=>[r.k,r.v]));
  const seq=[];
  x.steps.forEach((_,i)=>seq.push({ph:0,i}));
  PL.forEach((_,i)=>seq.push({ph:1,i}));seq.push({ph:1,i:PL.length,fin:true});
  BSL.forEach((_,i)=>seq.push({ph:2,i}));seq.push({ph:2,i:BSL.length,res:true});seq.push({ph:2,i:BSL.length+1,fin:true});
  isRows.forEach((_,i)=>seq.push({ph:3,i}));bsRows.forEach((_,i)=>seq.push({ph:4,i}));cfRows.forEach((_,i)=>seq.push({ph:5,i}));
  return {n,x,posts,bal,order,PL,costs,revs,res,BSL,isRows,isMap,bsRows,sA,sP,cfRows,cfMap,seq,why:WHY[n]||{}};
}

/* könyvelési tételek listája egy vagy több számlára */
function postList(names){
  const ps=D.posts.filter(p=>names.includes(p.a));
  if(!ps.length)return '<div class="none">Nincs könyvelt tétel.</div>';
  let h=ps.map(p=>`<div class="pl ${p.s}"><span class="st">${p.st}.</span><span class="s">${p.s}</span><span class="a">${SH(p.a)}${p.cp.length?' <small>↔ '+p.cp.map(SH).join(', ')+'</small>':''}</span><span class="v">${fmt(p.v)}</span></div>`).join('');
  const nets=names.filter(a=>a in D.bal);
  h+=nets.map(a=>`<div class="pnet"><span>${SH(a)} egyenlege</span><b>${D.bal[a]===0?'0':(D.bal[a]>0?'T ':'K ')+fmt(Math.abs(D.bal[a]))}</b></div>`).join('');
  return h;
}
const calcBox=(title,html)=>`<div class="jt">${title}</div>${html}`;

/* ---------- Eredménykimutatás: miért, hogyan ---------- */
function isFx(terms){const m=D.isMap,parts=terms.filter(([c])=>m[c]).map(([c,s])=>({v:s*m[c],n:c}));return parts.length?parts:null}
function isWhy(r){
  const k=r.k,v=r.v,m=D.isMap,c=D.why['is:'+k];
  const F=(terms,res)=>{const p=isFx(terms);return p?sumStr(p,res):'Minden tag 0, így <b>0</b>.'};
  const accs=ISACC[k];
  let why='',calc='';
  const list=(acct,side,R)=>D.posts.filter(p=>p.a===acct&&p.s===side).map(p=>{const cp=p.cp[0];return (R[cp]||SH(cp))+' ('+fmt(p.v)+')'}).join('; ');
  switch(k){
    case '01':why='Az Árbevétel számla K-egyenlege. A teljesítéskor a teljes számlaérték árbevétel; hogy a vevő mennyit fizetett meg, az csak a mérleget (vevő, pénz) és a cash-flow-t érinti.';break;
    case 'I':why='Értékesítés nettó árbevétele = belföldi (01) + export (02). Exportárbevétel nincs, ezért a részösszeg a 01. sorral egyezik.';calc=calcBox('Számítás',F([['01',1],['02',1]],v));break;
    case '03':why='A saját előállítású eszközök aktivált értéke bevételjellegű ellentétel. Az eszköz létrehozásának költségei költségnemenként (anyag, bér, écs., szolgáltatás) a IV–VI. sorokban jelennek meg; ez a sor semlegesíti őket, mert a ráfordításból eszköz lett.';break;
    case 'II':why='Aktivált saját teljesítmények = saját termelésű készletek állományváltozása (04, itt nincs) + saját előállítású eszközök aktivált értéke (03).';calc=calcBox('Számítás',F([['03',1]],v));break;
    case 'III':why='Egyéb bevétel minden olyan üzemi bevétel, amely nem árbevétel. Itt: '+(list('Egyéb bevételek','K',REAS_B)||'—')+'.';break;
    case '05':why='Az anyagköltség a felhasznált anyagok bekerülési értéke. Összköltség eljárásban akkor is itt szerepel, ha a munka eredménye eszköz lesz'+(m.II?' (ezt a II. sor ellentételezi).':'.');break;
    case '06':{const t=D.posts.filter(p=>p.a==='Igénybe vett szolgáltatások');const K=t.filter(p=>p.s==='K').reduce((s,p)=>s+p.v,0),Tt=t.filter(p=>p.s==='T').reduce((s,p)=>s+p.v,0);const pie=t.some(p=>p.cp.includes('Passzív időbeli elhatárolások'));
      why='Igénybe vett szolgáltatás (bérleti díj, tanácsadás): csak a tárgyévre jutó rész költség.'+(K?` A ${fmt(Tt)} díjból ${fmt(K)}-et aktív időbeli elhatárolással a következő évekre vittünk, így ${fmt(v)} marad.`:'')+(pie?' A díjat még nem fizettük ki, de a tárgyévhez tartozik, ezért passzív elhatárolással költségként elszámoljuk.':'');break}
    case '08':why='Az eladott áruk beszerzési értéke. A beszerzéskor az áru még csak készlet (mérlegtétel); ráfordítás az eladás pillanatában lesz, így párosul az árbevétellel.';break;
    case 'IV':why='Anyagjellegű ráfordítások = 05 anyagköltség + 06 igénybe vett szolgáltatások + 07 egyéb szolgáltatások + 08 ELÁBÉ + 09 közvetített szolgáltatások.';calc=calcBox('Számítás',F([['05',1],['06',1],['07',1],['08',1],['09',1]],v));break;
    case '10':{const open=(D.bal['Jövedelem-elszámolási számla']||0)<0;why='A bérköltség a tárgyévi munkavégzéshez tartozik, függetlenül attól, hogy kifizettük-e. '+(open?'A ki nem fizetett bér kötelezettségként a mérlegbe kerül.':'A kifizetés a pénzeszközöket csökkentette.');break}
    case 'V':why=m['10']?'Személyi jellegű ráfordítások = bérköltség (10) + egyéb személyi jellegű kifizetések (11) + bérjárulékok (12). A példák járulékkal nem számolnak.':'A feladat a személyi jellegű ráfordítást egy összegben adja meg; kifizetése a pénzeszközöket csökkentette.';if(m['10'])calc=calcBox('Számítás',F([['10',1]],v));else calc=calcBox('Forrás',postList(['Személyi jellegű ráfordítások']));break;
    case 'VI':why='Az értékcsökkenés az eszközök használatából eredő értékvesztés. Költség, de pénzkiadással nem jár (a pénz a beszerzéskor ment ki).';break;
    case 'VII':why='Egyéb ráfordítás minden olyan üzemi ráfordítás, amely nem költségnem. Itt: '+(list('Egyéb ráfordítások','T',REAS_R)||'—')+'.';break;
    case 'A':why='Az üzemi (üzleti) tevékenység eredménye: üzemi bevételek (I, II, III) mínusz üzemi ráfordítások (IV, V, VI, VII).';calc=calcBox('Számítás',F([['I',1],['II',1],['III',1],['IV',-1],['V',-1],['VI',-1],['VII',-1]],v));break;
    case 'VIII':why='Pénzügyi bevétel (kapott kamat, osztalék, árfolyamnyereség) ebben a példában nincs.';break;
    case '19':why='A hitel vagy kötvény használatáért fizetett kamat pénzügyi ráfordítás, nem üzemi költség, ezért a B. pénzügyi eredményt rontja.';break;
    case 'IX':why='Pénzügyi műveletek ráfordításai: itt csak a fizetett kamat (19. sor).';calc=calcBox('Számítás',F([['19',1]],v));break;
    case 'B':why='Pénzügyi műveletek eredménye = pénzügyi bevételek (VIII) − pénzügyi ráfordítások (IX).';calc=calcBox('Számítás',F([['VIII',1],['IX',-1]],v));break;
    case 'C':why='Adózás előtti eredmény = üzemi eredmény (A) + pénzügyi eredmény (B). Ez lesz a cash-flow kimutatás kiinduló sora.';calc=calcBox('Számítás',F([['A',1],['B',1]],v));break;
    case 'D':why='Társasági adóval a példák nem számolnak, így az adózott eredmény megegyezik az adózás előtti eredménnyel. Ez az összeg kerül a mérlegbe, a saját tőkén belül az adózott eredmény sorra.';calc=calcBox('Számítás',`C ${fmt(m.C||0)} − társasági adó 0 = <b>${fmt(v)}</b>`);break;
  }
  if(!calc&&accs)calc=calcBox('Forrás: főkönyvi tételek',postList(accs));
  if(v===0&&!['A','B','C','D','VIII'].includes(k))why+=' Az érték 0.';
  return {why:c||why,calc};
}

/* ---------- Mérleg: miért, hogyan ---------- */
function bsWhy(r){
  if(r.tot){
    const top=D.bsRows.filter(x=>!x.tot&&x.side===r.side&&x.l===0);
    return {why:(r.side==='A'?'Eszközök összesen: a főcsoportok összege.':'Források összesen: a főcsoportok összege.')+' A kettős könyvvitel miatt minden tétel két helyen hat, ezért '+(r.side==='A'?'meg kell egyeznie a források összesennel.':'egyezik az eszközök összesennel.')+` Itt mindkettő ${fmt(D.sA)}.`,
      calc:calcBox('Számítás',top.length?sumStr(top.map(x=>({v:x.v,n:x.label})),r.v):'Nincs érintett főcsoport: <b>0</b>.')};
  }
  const L=r.label,ov=D.why['bs:'+L];
  const dir=r.v>0?`${fmt(r.v)}-tal nő`:r.v<0?`${fmt(Math.abs(r.v))}-tal csökken`:'nem változik';
  let why=(CLS[L]?CLS[L]+' ':''),calc='';
  if(r.kids.length){
    why+=`A csoport ${dir}: az alábbi sorok összege.`;
    calc=calcBox('Részösszeg',sumStr(r.kids.map(x=>({v:x.v,n:x.label})),r.v));
  }else if(L==='Adózott eredmény'){
    why=`Az eredménykimutatás D. sorából jön (${fmt(r.v)}). Ez köti össze a két kimutatást: a tárgyévi ${r.v>=0?'nyereség növeli':'veszteség csökkenti'} a saját tőkét.`;
    calc=calcBox('Kapcsolat','EK D. adózott eredmény = <b>'+fmt(r.v)+'</b>');
  }else if(L==='Saját tőke'){
    why+='Eredményhatás és tőkemozgás nincs, ezért a saját tőke nem változik.';
  }else{
    const names=(ALIAS[L]||[L]).filter(a=>a in D.bal);
    why+=`A tárgyévben ${dir}.`+(r.v===0&&names.length?' A könyvelt tételek kiegyenlítik egymást, a számla lezárul.':'');
    calc=calcBox('Forrás: főkönyvi tételek',names.length?postList(names):'<div class="none">Közvetlen tétel nincs.</div>');
  }
  return {why:ov||why,calc};
}

/* ---------- Cash-flow: miért, hogyan ---------- */
function cfWhy(r,i){
  const k=r.k,v=r.v,ov=D.why['cf:'+k],pos=v>0,neg=v<0,R=D.cfRows;
  let why='',calc='';
  const sec=['I','II','III'];
  if(sec.includes(k)){
    const items=[];for(let j=i+1;j<R.length&&!['I','II','III','IV'].includes(R[j].k);j++)items.push(R[j]);
    const nm={I:'Működési (szokásos tevékenységből származó)',II:'Befektetési',III:'Finanszírozási'}[k];
    why=nm+' cash flow: '+({I:'az adózás előtti eredményből indul, majd kiszűri a pénzmozgás nélküli tételeket és a forgótőke változását.',II:'tartós eszközök beszerzése és eladása.',III:'tulajdonosi és hitelezői pénzmozgások (tőkebevonás, hitel, kötvény, törlesztés).'}[k]);
    calc=calcBox('Számítás',items.length?sumStr(items.map(x=>({v:x.v,n:x.k+'.'})),v):'Nincs ilyen tétel: <b>0</b>.');
    return {why:ov||why,calc};
  }
  if(k==='IV'){
    const pz=D.bsRows.find(x=>x.label==='Pénzeszközök');
    why='A pénzeszközök változása a három rész összege. Ellenőrzés: egyeznie kell a mérleg pénzeszközök sorának változásával'+(pz?` (${fmt(pz.v)}).`:' (itt 0).');
    calc=calcBox('Számítás',sumStr(['I','II','III'].map(c=>({v:D.cfMap[c]||0,n:c})),v));
    return {why:ov||why,calc};
  }
  const T={
   '1':'Az indirekt módszer kiindulópontja az adózás előtti eredmény (EK C. sor). A következő sorok kiszűrik azokat a tételeket, amelyek az eredményt pénzmozgás nélkül alakították.',
   '2':'Az értékcsökkenés költségként csökkentette az eredményt, de pénzkiadással nem járt, ezért visszaadjuk (+).',
   '3':pos?'Az elszámolt értékvesztés csökkentette az eredményt, de pénzt nem mozgatott, ezért visszaadjuk (+).':'A visszaírt értékvesztés növelte az eredményt pénzbeáramlás nélkül, ezért levonjuk (−).',
   '4':pos?'A céltartalék-képzés ráfordításként csökkentette az eredményt, de pénzkiadás nem volt, ezért visszaadjuk (+).':'A céltartalék felhasználása, felszabadítása egyéb bevételként növelte az eredményt pénz nélkül, ezért levonjuk (−). A tényleges kiadások már a költségsorokban szerepelnek.',
   '5':pos?'Az eszközeladás vesztesége csökkentette az eredményt; az eladás teljes pénzhatása a befektetési CF-be tartozik, ezért itt visszaadjuk (+).':'Az eszközeladás nyeresége a befektetési CF-be tartozik, ezért itt levonjuk (−).',
   '6':pos?'A szállítói tartozás nőtt: a beszerzés megtörtént, de még nem fizettünk, a pénz bent maradt, ezért hozzáadjuk (+).':'A szállítói tartozás csökkent: kifizettük, ezért levonjuk (−).',
   '7':pos?'Egyéb rövid lejáratú kötelezettség nőtt (ki nem fizetett bér, kapott előleg): a pénz bent maradt vagy befolyt, ezért hozzáadjuk (+).':'Egyéb rövid lejáratú kötelezettség csökkent, ezért levonjuk (−).',
   '8':'A passzív időbeli elhatárolás nőtt: a költség terhelte az eredményt, de nem fizettük ki, ezért visszaadjuk (+).',
   '9':neg?'A vevőkövetelés nőtt: az árbevétel egy része nem folyt be pénzként, ezért levonjuk (−).':'A vevőkövetelés csökkent: korábbi követelés folyt be, ezért hozzáadjuk (+).',
   '10':pos?'A készletek csökkentek: a felhasználás, eladás költségként csökkentette az eredményt, de a pénz nem most ment ki, ezért visszaadjuk (+).':'A készletek nőttek, a beszerzés pénzt köt le, ezért levonjuk (−).',
   '11':'Az aktív időbeli elhatárolás nőtt: kifizettük, de nem a tárgyév költsége, ezért a pénzkiáramlást itt levonjuk (−).',
   '14':'Befektetett eszközök beszerzése a befektetési CF-ben kiáramlás (−). Ha a beszerzés pénz nélkül történt (aktiválás, kifizetetlen számla), az ellentétel a működési CF-ben van, így a végösszeg helyes marad.',
   '15':'A befektetett eszköz eladási ára a befektetési CF-ben beáramlás (+).',
   '17':'A részvénykibocsátásból befolyt teljes összeg (névérték + ázsió) finanszírozási beáramlás.',
   '18':'A kötvénykibocsátásból befolyt pénz finanszírozási beáramlás.',
   '19':'A felvett hitel, kölcsön finanszírozási beáramlás.',
   '24':'A hitel tőketörlesztése finanszírozási kiáramlás. A kamat nem itt, hanem az eredményen keresztül a működési CF-ben jelenik meg.'};
  why=T[k]||'';
  if(k==='1')calc=calcBox('Kapcsolat','EK C. adózás előtti eredmény = <b>'+fmt(v)+'</b>');
  else if(CFACC[k]){const names=CFACC[k].filter(a=>a in D.bal);
    const rule=k==='2'?'Költség, pénz nélkül → +':(['9','10','11'].includes(k)?'Eszköz nő → pénz kötődik le (−); eszköz csökken → (+)':'Forrás nő → pénz marad bent (+); forrás csökken → (−)');
    calc=calcBox('Mérlegváltozásból',(names.length?names.map(a=>{const c=catOf(a),ch=c==='eszk'||c==='kolt'?D.bal[a]:-D.bal[a];return `<div class="pnet"><span>${SH(a)} változása</span><b>${ch>0?'+':''}${fmt(ch)}</b></div>`}).join(''):'')+`<div class="rule">${rule}</div><div class="pnet"><span>CF-sor</span><b>${v>0?'+':''}${fmt(v)}</b></div>`);}
  else if(k==='3'||k==='5')calc=calcBox('Korrekció',`Eredményhatás ${fmt(-v)} → visszafordítva: <b>${v>0?'+':''}${fmt(v)}</b>`);
  else calc=calcBox('Pénzmozgás','<b>'+(v>0?'+':'')+fmt(v)+'</b>');
  return {why:ov||why,calc};
}

/* ---------- navigáció ---------- */
function buildNav(){
  $('#nav').innerHTML=EX.map((x,i)=>`<li><button data-i="${i}" title="${x.t}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="t">${x.t}</span></button></li>`).join('');
  $('#nav').addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)go(+b.dataset.i)});
}
function go(i){
  stop();cur=Math.max(0,Math.min(EX.length-1,i));pos=0;D=build(EX[cur],cur+1);
  try{localStorage.setItem('szv-cur',cur)}catch(_){}
  history.replaceState(null,'','#p'+(cur+1));
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current',+b.dataset.i===cur?'true':'false'));
  const nb=document.querySelector('#nav button[aria-current="true"]');nb&&nb.scrollIntoView({block:'nearest',inline:'center'});
  renderMain();
}

function renderMain(){
  const x=EX[cur],n=cur+1;
  $('#main').innerHTML=`
  <section class="head">
    <div class="eyebrow">Példa ${String(n).padStart(2,'0')} / ${EX.length} · <em>${x.tag}</em></div>
    <h2>${x.t}</h2>
    <p class="task">${x.task}</p>
  </section>
  <section class="player" aria-label="Lépésenkénti megoldás">
    <div class="phases" id="phases" role="tablist">${PHN.map((p,i)=>`<button data-p="${i}" role="tab"><span>${i+1}</span>${p}</button>`).join('')}</div>
    <div class="ctrl">
      <button class="btn" id="prev">← Előző</button>
      <button class="btn pri" id="next">Következő →</button>
      <button class="btn" id="play">▶ Lejátszás</button>
      <button class="btn" id="end">Szakasz vége</button>
      <div class="dots" id="dots"></div>
    </div>
    <div id="stage"></div>
  </section>
  <section aria-label="Összesítés">
    <h3 class="sec-t">Összesítés <small>az esemény teljes hatása a tárgyévi kimutatásokra</small></h3>
    <div class="stmts" id="stmts"></div>
  </section>
  <section class="take">
    <div class="card"><div class="lbl2">A lényeg</div><p>${x.key}</p></div>
    ${x.note?`<div class="card note"><div class="lbl2">Megjegyzés a megoldókulcshoz</div><p>${x.note}</p></div>`:''}
  </section>
  <div class="pager">
    <button class="btn" id="pp" ${cur===0?'disabled':''}>← ${cur>0?cur+'. '+EX[cur-1].t:'Első példa'}</button>
    <span class="kbd"><kbd>←</kbd><kbd>→</kbd> lépés · <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> példa</span>
    <button class="btn" id="np" ${cur===EX.length-1?'disabled':''}>${cur<EX.length-1?(cur+2)+'. '+EX[cur+1].t:'Utolsó példa'} →</button>
  </div>`;
  $('#prev').onclick=()=>{stop();setPos(pos-1)};
  $('#next').onclick=()=>{stop();setPos(pos+1)};
  $('#end').onclick=()=>{stop();const ph=D.seq[pos].ph;let j=pos;while(j+1<D.seq.length&&D.seq[j+1].ph===ph)j++;setPos(j)};
  $('#play').onclick=()=>timer?stop():play();
  $('#phases').onclick=ev=>{const b=ev.target.closest('button');if(b){stop();setPos(D.seq.findIndex(s=>s.ph===+b.dataset.p))}};
  $('#dots').onclick=ev=>{const b=ev.target.closest('button');if(b){stop();setPos(+b.dataset.q)}};
  $('#pp').onclick=()=>go(cur-1);$('#np').onclick=()=>go(cur+1);
  renderStmts();render();
  window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
}
function setPos(p){p=Math.max(0,Math.min(D.seq.length-1,p));if(p===pos)return;pos=p;render()}

function render(){
  const s=D.seq[pos],ph=s.ph;
  $('#prev').disabled=pos===0;$('#next').disabled=pos===D.seq.length-1;
  document.querySelectorAll('#phases button').forEach(b=>{const p=+b.dataset.p;b.className=p===ph?'on':(p<ph?'done':'');b.setAttribute('aria-selected',p===ph)});
  const idx=D.seq.map((q,i)=>[q,i]).filter(([q])=>q.ph===ph);
  $('#dots').innerHTML=idx.map(([q,i],j)=>`<button data-q="${i}" class="${i===pos?'cur':(i<pos?'done':'')}" aria-label="${j+1}. lépés">${j+1}</button>`).join('');
  $('#end').disabled=idx[idx.length-1][1]===pos;
  const k=idx.findIndex(([,i])=>i===pos)+1,N=idx.length;
  const head=`<div class="k">${PHN[ph].toUpperCase()} · ${k}. / ${N}</div>`;
  const st=$('#stage');
  if(ph===0)st.innerHTML=stBook(s,head);
  else if(ph===1)st.innerHTML=stPL(s,head);
  else if(ph===2)st.innerHTML=stBS(s,head);
  else st.innerHTML=stStmt(s,head,ph);
  const c=st.querySelector('.srow.cur');if(c&&ph>=3)c.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});
}

/* T-számlák rácsa; closedPL/closedBS = lezárt számlák halmaza, hot = aktuális számla */
function tGrid(upTo,closed,hot,target){
  const acc=new Map();
  D.posts.filter(p=>p.st<=upTo).forEach(p=>{if(!acc.has(p.a))acc.set(p.a,{T:[],K:[],first:p.st});acc.get(p.a)[p.s].push(p)});
  if(!acc.size)return '<div class="empty">Ebben a lépésben még nincs könyvelt tétel.</div>';
  return '<div class="taccs">'+[...acc].map(([a,o])=>{
    const c=catOf(a),bal=o.T.reduce((s,r)=>s+r.v,0)-o.K.reduce((s,r)=>s+r.v,0);
    const isNew=r=>target===undefined&&r.st===upTo;
    const isHot=target===undefined?[...o.T,...o.K].some(r=>r.st===upTo):a===hot;
    const cl=closed&&closed.get(a);
    const rows=(arr,side)=>arr.map(r=>`<div class="r ${isNew(r)?'new':''}"><i>${r.st}.</i><span>${fmt(r.v)}</span></div>`).join('')+(cl&&bal!==0&&side===(bal>0?'K':'T')?`<div class="r z ${a===hot?'new':''}"><i>Z</i><span>${fmt(Math.abs(bal))}</span></div>`:'');
    const fresh=target===undefined&&o.first===upTo;
    return `<div class="tacc ${isHot?'hot':''} ${cl&&a!==hot?'closed':''}" style="${fresh?'':'animation:none'}">
      <div class="th"><span class="nm" title="${a}">${SH(a)}</span><span class="cat" style="color:var(--c-${c})">${CATN[c]}</span></div>
      <div class="tb"><div class="col d"><span class="ch">T</span>${rows(o.T,'T')}</div><div class="col c"><span class="ch">K</span>${rows(o.K,'K')}</div></div>
      <div class="tf">${cl?`<span>Lezárva → ${cl}</span><b>0</b>`:`<span>Egyenleg</span><b>${bal===0?'0':(bal>0?'T ':'K ')+fmt(Math.abs(bal))}</b>`}</div></div>`}).join('')+'</div>';
}
const jline=(s,a,v)=>`<div class="jl ${s}"><span class="s">${s}</span><span class="a">${a}</span><span class="v">${fmt(v)}</span></div>`;

function stBook(s,head){
  const st=D.x.steps[s.i];
  const j=st.p.length?[...st.p].sort((a,b)=>a.s===b.s?0:(a.s==='T'?-1:1)).map(p=>jline(p.s,SH(p.a),p.v)).join(''):'<div class="none">Ebben a lépésben nincs könyvelés.</div>';
  return `<div class="stepbox"><div class="expl" aria-live="polite">${head}<p>${st.x}</p></div><div class="journal"><div class="jt">Könyvelési tétel</div>${j}</div></div>${tGrid(s.i+1)}`;
}

function sumT(title,lt,rt,L,R,totL,totR,showTot){
  const rows=arr=>arr.map(r=>`<div class="sr ${r.cls||''}"><span>${r.g?`<small>${r.g}</small>`:''}${r.n}</span><b>${fmt(r.v)}</b></div>`).join('')||'<div class="sr ph"><span>—</span></div>';
  return `<div class="sumT"><div class="sumh">${title}</div><div class="sumb"><div class="col d"><div class="ch">${lt}</div>${rows(L)}</div><div class="col c"><div class="ch">${rt}</div>${rows(R)}</div></div>${showTot?`<div class="sumf"><span>Összesen: <b>${fmt(totL)}</b></span><span>Összesen: <b>${fmt(totR)}</b></span></div>`:''}</div>`;
}

function stPL(s,head){
  const PL=D.PL,done=PL.slice(0,s.fin?PL.length:s.i+1),cur=s.fin?null:PL[s.i];
  const closed=new Map(done.map(p=>[p.a,'Eredmény']));
  let x,j;
  if(!PL.length){x='Ebben a példában nincs bevételi vagy ráfordítási számla, ezért az eredményszámlára nem kerül tétel: <b>az eredmény 0</b>.';j='<div class="none">Nincs zárótétel.</div>'}
  else if(s.fin){const pr=D.res>=0;x=`<b>Az eredmény meghatározása:</b> bevételek ${fmt(D.revs)} − ráfordítások ${fmt(D.costs)} = <b>${fmt(D.res)}</b>. ${D.res===0?'A két oldal egyenlő, az eredmény 0.':pr?'A bevételi (K) oldal nagyobb: nyereség. Az egyenleget a T oldalon rendezzük.':'A ráfordítási (T) oldal nagyobb: veszteség. Az egyenleget a K oldalon rendezzük.'} Adó nincs, így ez az adózott eredmény is.`;
    j=D.res===0?'<div class="none">Nincs egyenleg.</div>':(D.res>0?jline('T','Eredményszámla',D.res)+jline('K','Adózott eredmény (mérleg)',D.res):jline('T','Adózott eredmény (mérleg)',-D.res)+jline('K','Eredményszámla',-D.res))}
  else{const p=cur,cost=p.side==='T';
    x=`<b>${SH(p.a)} lezárása:</b> ${cost?'ráfordítás':'bevétel'}, ${cost?'T':'K'}-egyenlege ${fmt(p.v)}. Az eredményszámla <b>${cost?'T (ráfordítás)':'K (bevétel)'}</b> oldalára kerül, az eredménykimutatás „${p.g}” sorába. A zárótétellel (Z) a számla egyenlege 0 lesz.`;
    j=cost?jline('T','Eredményszámla',p.v)+jline('K',SH(p.a),p.v):jline('T',SH(p.a),p.v)+jline('K','Eredményszámla',p.v)}
  const L=done.filter(p=>p.side==='T').map(p=>({n:SH(p.a),g:p.g,v:p.v,cls:p===cur?'new':''}));
  const R=done.filter(p=>p.side==='K').map(p=>({n:SH(p.a),g:p.g,v:p.v,cls:p===cur?'new':''}));
  if(s.fin&&D.res!==0)(D.res>0?L:R).push({n:D.res>0?'Eredmény (nyereség)':'Eredmény (veszteség)',v:Math.abs(D.res),cls:'res new'});
  const tl=L.reduce((a,r)=>a+r.v,0),tr=R.reduce((a,r)=>a+r.v,0);
  return `<div class="stepbox"><div class="expl" aria-live="polite">${head}<p>${x}</p></div><div class="journal"><div class="jt">Zárótétel</div>${j}</div></div>
  ${sumT('Eredményszámla','T · Ráfordítások','K · Bevételek',L,R,tl,tr,s.fin)}
  <details class="mini" open><summary>Főkönyvi számlák</summary>${tGrid(D.x.steps.length,closed,cur&&cur.a,true)}</details>`;
}

function stBS(s,head){
  const B=D.BSL,n=s.res||s.fin?B.length:s.i+1,done=B.slice(0,n),cur=s.res||s.fin?null:B[s.i];
  const closed=new Map([...D.PL.map(p=>[p.a,'Eredmény']),...done.map(p=>[p.a,'Mérleg'])]);
  let x,j;
  if(s.res){x=`<b>Adózott eredmény:</b> az eredményszámla egyenlege (${fmt(D.res)}) a saját tőke részeként a mérlegszámla <b>forrás (K)</b> oldalára kerül. ${D.res<0?'Veszteség esetén negatív forrásként jelenik meg.':''} Ezzel kapcsolódik össze az eredménykimutatás és a mérleg.`;
    j=D.res===0?'<div class="none">Az eredmény 0, nincs tétel.</div>':(D.res>0?jline('T','Eredményszámla',D.res)+jline('K','Zárómérleg-számla',D.res):jline('T','Zárómérleg-számla',-D.res)+jline('K','Eredményszámla',-D.res))}
  else if(s.fin){const a=B.filter(p=>p.side==='T').reduce((q,p)=>q+p.v,0),f=B.filter(p=>p.side==='K').reduce((q,p)=>q+p.v,0)+D.res;
    x=`<b>Egyezés:</b> eszközök változása ${fmt(a)} = források változása ${fmt(f)}. A kettős könyvvitel miatt minden tétel két számlán hat, ezért a mérlegszámla két oldala mindig egyenlő. A mérlegszámla <b>változásokat</b> mutat, ezért a csökkenés negatív előjellel szerepel.`;
    j=`<div class="pnet"><span>Eszközök (T)</span><b>${fmt(a)}</b></div><div class="pnet"><span>Források (K)</span><b>${fmt(f)}</b></div>`}
  else{const p=cur,A=p.side==='T',c=catOf(p.a);
    x=`<b>${SH(p.a)} lezárása:</b> ${CATN[c].toLowerCase()}számla, változása <b>${p.v>0?'+':''}${fmt(p.v)}</b>. A mérlegszámla <b>${A?'eszköz (T)':'forrás (K)'}</b> oldalára kerül. ${p.v===0?'Egyenlege 0, mert a tételei kiegyenlítik egymást: a mérlegben nem változik.':p.v<0?(A?'Az eszköz csökkent, ezért negatív előjellel szerepel.':'A forrás csökkent, ezért negatív előjellel szerepel.'):(A?'Az eszköz nőtt.':'A forrás nőtt.')}`;
    const v=Math.abs(p.v);
    j=p.v===0?'<div class="none">Egyenleg 0: zárótétel nélkül lezárul.</div>':((A===(p.v>0))?jline('T','Zárómérleg-számla',v)+jline('K',SH(p.a),v):jline('T',SH(p.a),v)+jline('K','Zárómérleg-számla',v))}
  const L=done.filter(p=>p.side==='T').map(p=>({n:SH(p.a),g:CATN[catOf(p.a)],v:p.v,cls:p===cur?'new':''}));
  const R=done.filter(p=>p.side==='K').map(p=>({n:SH(p.a),g:CATN[catOf(p.a)],v:p.v,cls:p===cur?'new':''}));
  if(s.res||s.fin)R.push({n:'Adózott eredmény',g:'Saját tőke',v:D.res,cls:'res'+(s.res?' new':'')});
  const tl=L.reduce((a,r)=>a+r.v,0),tr=R.reduce((a,r)=>a+r.v,0);
  return `<div class="stepbox"><div class="expl" aria-live="polite">${head}<p>${x}</p></div><div class="journal"><div class="jt">Zárótétel</div>${j}</div></div>
  ${sumT('Zárómérleg-számla (változások)','T · Eszközök','K · Források',L,R,tl,tr,s.fin)}
  <details class="mini" open><summary>Főkönyvi számlák</summary>${tGrid(D.x.steps.length,closed,cur&&cur.a,true)}</details>`;
}

function srow(cls,label,v,state){return `<div class="srow row ${cls} ${state} ${v===0?'zero':''}"><span>${label}</span><span class="v ${v<0?'neg':''}">${fmt(v)}</span></div>`}
function stStmt(s,head,ph){
  let card,w;
  if(ph===3){const R=D.isRows;card=`<h3>Eredménykimutatás <span class="badge" style="background:var(--sunk);color:var(--muted)">összköltség eljárás</span></h3>`+R.map((r,i)=>srow(/^\d/.test(r.k)?'it':'sub',r.label,r.v,i<s.i?'past':i===s.i?'cur':'fut')).join('');w=isWhy(R[s.i])}
  else if(ph===4){const R=D.bsRows;const side=sd=>R.map((r,i)=>[r,i]).filter(([r])=>r.side===sd).map(([r,i])=>srow(r.tot?'tot':'l'+r.l,r.label,r.v,i<s.i?'past':i===s.i?'cur':'fut')).join('');
    card=`<h3>Mérleg</h3><div class="bs"><div class="side"><h4>Eszközök</h4>${side('A')}</div><div class="side"><h4>Források</h4>${side('P')}</div></div>`;w=bsWhy(R[s.i])}
  else{const R=D.cfRows;card=`<h3>Cash-flow kimutatás <span class="badge" style="background:var(--sunk);color:var(--muted)">indirekt</span></h3>`+R.map((r,i)=>srow(/^\d/.test(r.k)?'it':(r.k==='IV'?'tot':'sub'),r.label,r.v,i<s.i?'past':i===s.i?'cur':'fut')).join('');w=cfWhy(R[s.i],s.i)}
  const label=ph===3?D.isRows[s.i].label:ph===4?D.bsRows[s.i].label:D.cfRows[s.i].label;
  const val=ph===3?D.isRows[s.i].v:ph===4?D.bsRows[s.i].v:D.cfRows[s.i].v;
  return `<div class="split"><div class="card stmt">${card}</div><div class="panel"><div class="expl" aria-live="polite">${head}<div class="ln">${label}</div><div class="lv num ${val<0?'neg':''}">${fmt(val)}</div><p>${w.why}</p></div>${w.calc?`<div class="journal">${w.calc}</div>`:''}</div></div>`;
}

/* ---------- összesítő kimutatások ---------- */
function rowHTML(cls,label,v,d){return `<div class="row ${cls} ${v===0?'zero':''}" style="animation-delay:${d}ms"><span>${label}</span><span class="v ${v<0?'neg':''}" data-v="${v}">${fmt(v)}</span></div>`}
function renderStmts(){
  let d=0;const g=35;
  const A=D.bsRows.filter(r=>r.side==='A'),P=D.bsRows.filter(r=>r.side==='P');
  const side=(rows,name)=>`<div class="side"><h4>${name}</h4>${rows.map(r=>rowHTML(r.tot?'tot':'l'+r.l,r.label,r.v,(d+=g))).join('')}</div>`;
  const bs=`<div class="card wide"><h3>Mérleg <span class="badge">${D.sA===D.sP?'Eszközök = Források: '+fmt(D.sA):'Eltérés!'}</span></h3><div class="bs">${side(A,'Eszközök')}${side(P,'Források')}</div></div>`;
  d=0;const is=D.isRows.map(r=>rowHTML(/^\d/.test(r.k)?'it':'sub',r.label,r.v,(d+=g))).join('');
  d=0;const cf=D.cfRows.map(r=>rowHTML(/^\d/.test(r.k)?'it':(r.k==='IV'?'tot':'sub'),r.label,r.v,(d+=g))).join('');
  $('#stmts').innerHTML=bs+`<div class="card"><h3>Eredménykimutatás</h3>${is}</div><div class="card"><h3>Cash-flow kimutatás</h3>${cf}</div>`;
  if(!RM)countUp();
}
function countUp(){
  const els=[...document.querySelectorAll('#stmts .v[data-v]')],t0=performance.now(),Dur=650;
  function f(t){const k=Math.min(1,(t-t0)/Dur),ez=1-Math.pow(1-k,3);els.forEach(el=>{el.textContent=fmt(+el.dataset.v*ez)});if(k<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
}

function play(){
  if(pos>=D.seq.length-1){pos=0;render()}
  $('#play').textContent='❚❚ Szünet';
  timer=setInterval(()=>{if(pos>=D.seq.length-1){stop();return}pos++;render()},3000);
}
function stop(){if(timer){clearInterval(timer);timer=null}const b=$('#play');if(b)b.textContent='▶ Lejátszás'}

document.addEventListener('keydown',ev=>{
  if(ev.target.closest('input,textarea,select'))return;
  if(ev.key==='ArrowRight'){ev.preventDefault();ev.shiftKey?go(cur+1):(stop(),setPos(pos+1))}
  if(ev.key==='ArrowLeft'){ev.preventDefault();ev.shiftKey?go(cur-1):(stop(),setPos(pos-1))}
});

buildNav();
let start=0;
const h=location.hash.match(/^#p(\d+)$/);
if(h)start=+h[1]-1;else{try{const s=localStorage.getItem('szv-cur');if(s!==null)start=+s}catch(_){}}
go(isNaN(start)?0:start);
</script>

</body>
</html>
